[build-system]
requires = ['setuptools>=77']
build-backend = 'setuptools.build_meta'

[project]
name = 'mutalyzer_mutator'
description = 'Mutalyzer sequence mutator.'
version = '0.2.2'

authors = [
    {name = 'LUMC, Mihai Lefter', email = 'M.Lefter@lumc.nl'}]
readme = 'README.md'
urls = {Homepage = 'https://github.com/mutalyzer/mutator'}
keywords = ['Mutalyzer', 'mutate', 'description', 'sequence', 'dna', 'variant']
license = 'MIT'
classifiers = [
    'Intended Audience :: Developers',
    'Intended Audience :: Science/Research',
    'Operating System :: OS Independent',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Topic :: Scientific/Engineering :: Bio-Informatics']

requires-python = '>=3.9'

[tool.setuptools.packages.find]
include = ["mutalyzer_mutator*"]

[project.optional-dependencies]
test = [
    'pytest>=7.0']
dev = [
    'pytest>=7.0',
    'pytest-cov>=2.10.0',
    'ruff>=0.17.0']
release = [
    'build>=1.6.1',
    'twine>=7.0.0']
docs = [
    'sphinx>=4',
    'sphinx_rtd_theme>=3.1.0',
    'sphinx-autodoc-typehints'
]

[tool.ruff]
line-length = 89

[tool.ruff.lint]
select = ['C90', 'E', 'F', 'I', 'W']
ignore = ['E501', 'F401', 'F403']

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.coverage.run]
source = ['mutalyzer_mutator']
